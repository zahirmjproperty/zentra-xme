<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Factory frontage impression with covered loading bay">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071b33"/><stop offset="60%" stop-color="#0e2b4a"/><stop offset="100%" stop-color="#16375c"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c4a75"/><stop offset="100%" stop-color="#123b5f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12304a"/><stop offset="100%" stop-color="#0a1e33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c68f"/><stop offset="100%" stop-color="#c8a96a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fc8f0"/><stop offset="100%" stop-color="#2a6b96"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="620" fill="url(#sky)"/>
  <rect y="470" width="1200" height="150" fill="#0a1e33"/>
  <!-- covered loading canopy -->
  <path d="M120 300 H1080 L1044 268 H156 Z" fill="url(#facade)" stroke="#2b6ea3" stroke-width="2"/>
  <rect x="120" y="298" width="960" height="10" fill="#0b2540"/>
  <!-- main block -->
  <rect x="150" y="150" width="900" height="160" fill="url(#facade)" stroke="#2b6ea3" stroke-width="2"/>
  <!-- triple-volume clerestory band -->
  <g fill="url(#glass)" opacity=".9">
    <rect x="180" y="168" width="112" height="34" rx="2"/><rect x="314" y="168" width="112" height="34" rx="2"/>
    <rect x="448" y="168" width="112" height="34" rx="2"/><rect x="582" y="168" width="112" height="34" rx="2"/>
    <rect x="716" y="168" width="112" height="34" rx="2"/><rect x="850" y="168" width="112" height="34" rx="2"/>
  </g>
  <!-- office wing with gold trim -->
  <rect x="150" y="150" width="180" height="160" fill="#0f3355" stroke="#e0c68f" stroke-width="2"/>
  <g fill="url(#glass)">
    <rect x="168" y="184" width="60" height="26" rx="2"/><rect x="248" y="184" width="60" height="26" rx="2"/>
    <rect x="168" y="222" width="60" height="26" rx="2"/><rect x="248" y="222" width="60" height="26" rx="2"/>
  </g>
  <!-- roller shutters -->
  <g fill="#0b2540" stroke="#3d86bb" stroke-width="1.5">
    <rect x="400" y="252" width="150" height="58"/><rect x="590" y="252" width="150" height="58"/><rect x="780" y="252" width="150" height="58"/>
  </g>
  <g stroke="#3d86bb" stroke-width="1" opacity=".7">
    <path d="M400 262 H550 M400 272 H550 M400 282 H550 M400 292 H550 M400 302 H550"/>
    <path d="M590 262 H740 M590 272 H740 M590 282 H740 M590 292 H740 M590 302 H740"/>
    <path d="M780 262 H930 M780 272 H930 M780 282 H930 M780 292 H930 M780 302 H930"/>
  </g>
  <!-- slab / yard -->
  <rect x="150" y="330" width="900" height="120" fill="#12304a"/>
  <g stroke="#223f5e" stroke-width="1" opacity=".8">
    <path d="M150 366 H1050 M150 402 H1050 M300 330 V450 M450 330 V450 M600 330 V450 M750 330 V450 M900 330 V450"/>
  </g>
  <!-- 40-ft truck at bay -->
  <g>
    <rect x="610" y="352" width="150" height="56" rx="4" fill="#e8eef5" stroke="#9fb4c8" stroke-width="1.5"/>
    <rect x="760" y="366" width="46" height="42" rx="4" fill="#c8d6e4" stroke="#9fb4c8" stroke-width="1.5"/>
    <rect x="770" y="372" width="26" height="18" rx="2" fill="url(#glass)"/>
    <circle cx="650" cy="412" r="10" fill="#152238" stroke="#9fb4c8" stroke-width="2"/>
    <circle cx="700" cy="412" r="10" fill="#152238" stroke="#9fb4c8" stroke-width="2"/>
    <circle cx="788" cy="412" r="10" fill="#152238" stroke="#9fb4c8" stroke-width="2"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" fill="#cfe3f5">
    <text x="152" y="510" font-size="21" fill="#e0c68f">9 m clear height · covered loading · 40-ft container access</text>
    <text x="152" y="540" font-size="16" fill="#9fc0da">Indicative frontage impression — not an as-built drawing</text>
  </g>
</svg>
