<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Cross-section diagram of the factory unit">
  <rect width="1000" height="470" fill="#f4f7fa"/>
  <text x="34" y="40" font-size="18" font-weight="800" fill="#071b33" font-family="Inter,sans-serif">CROSS-SECTION — SEMI-DETACHED &amp; LINKED UNITS (SCHEMATIC)</text>
  <text x="34" y="62" font-size="12.5" fill="#4d6276" font-family="Inter,sans-serif">Own drawing based on the specification figures confirmed for Phase 3B. Not a developer drawing; not to scale.</text>

  <!-- level lines + dims -->
  <g stroke="#aabbc9" stroke-width="1" stroke-dasharray="5 5">
    <path d="M120 120 H940"/><path d="M120 380 H940"/>
  </g>
  <g font-family="Inter,sans-serif" font-size="12.5" fill="#1f4f78">
    <text x="946" y="124">FLOOR 1 (office level)</text>
    <text x="946" y="384">GROUND FLOOR</text>
  </g>
  <g stroke="#c9973c" stroke-width="1.4">
    <path d="M96 120 V380"/><path d="M90 120 H102 M90 380 H102"/>
  </g>
  <text x="60" y="256" font-size="13" font-weight="700" fill="#c9973c" font-family="Inter,sans-serif" transform="rotate(-90 60 256)">9.0 m</text>

  <!-- envelope -->
  <path d="M120 380 V180 H540 V380" fill="#eef3f8" stroke="#1f4f78" stroke-width="2"/>
  <path d="M540 380 V150 H940 V380" fill="#e8eff6" stroke="#1f4f78" stroke-width="2"/>
  <path d="M520 150 H960" stroke="#c9973c" stroke-width="2.5"/>

  <!-- triple volume warehouse clear space -->
  <path d="M560 380 V180 H920 V380" fill="#ffffff" stroke="#aabbc9" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="600" y="230" font-size="13" font-weight="700" fill="#1f4f78" font-family="Inter,sans-serif">TRIPLE-VOLUME WAREHOUSE</text>
  <text x="600" y="252" font-size="12.5" fill="#4d6276" font-family="Inter,sans-serif">Clear height minimum 9 m (29.5 ft)</text>
  <text x="600" y="272" font-size="12.5" fill="#4d6276" font-family="Inter,sans-serif">Floor loading: 1.0 t/m² (semi-D) · 0.5 t/m² (linked)</text>

  <!-- racking -->
  <g stroke="#c9973c" stroke-opacity="0.65" stroke-width="1.6" fill="none">
    <path d="M600 380 V300 H690 V380 M600 340 H690"/>
    <path d="M710 380 V300 H800 V380 M710 340 H800"/>
  </g>
  <g fill="#c9973c" opacity="0.5">
    <rect x="604" y="304" width="82" height="10"/><rect x="604" y="344" width="82" height="10"/>
    <rect x="714" y="304" width="82" height="10"/><rect x="714" y="344" width="82" height="10"/>
  </g>

  <!-- office band -->
  <path d="M120 120 H540" stroke="#1f4f78" stroke-width="2"/>
  <rect x="150" y="140" width="360" height="70" fill="#dfe9f3" stroke="#1f4f78" stroke-width="1.4"/>
  <text x="330" y="182" font-size="13" font-weight="700" fill="#1f4f78" text-anchor="middle" font-family="Inter,sans-serif">OPEN-PLAN OFFICE (FIRST FLOOR)</text>

  <!-- ground floor office/production -->
  <text x="330" y="330" font-size="13" font-weight="700" fill="#1f4f78" text-anchor="middle" font-family="Inter,sans-serif">PRODUCTION / WAREHOUSE</text>
  <text x="330" y="352" font-size="12.5" fill="#4d6276" text-anchor="middle" font-family="Inter,sans-serif">Open plan, flexible set-up</text>

  <!-- loading bay + truck -->
  <g>
    <path d="M940 380 v-96 h-16 v96" fill="#c9973c" opacity="0.18" stroke="#c9973c" stroke-width="1.6"/>
    <text x="884" y="304" font-size="12.5" font-weight="700" fill="#c9973c" font-family="Inter,sans-serif" text-anchor="middle">LOADING BAY</text>
    <rect x="830" y="402" width="132" height="34" rx="3" fill="#ffffff" stroke="#1f4f78" stroke-width="1.3"/>
    <path d="M790 436 v-22 h20 l12 -18 h16 v40 z" fill="#ffffff" stroke="#1f4f78" stroke-width="1.3"/>
    <circle cx="812" cy="440" r="8" fill="#eef3f8" stroke="#1f4f78" stroke-width="1.3"/>
    <circle cx="846" cy="440" r="8" fill="#eef3f8" stroke="#1f4f78" stroke-width="1.3"/>
    <circle cx="934" cy="440" r="8" fill="#eef3f8" stroke="#1f4f78" stroke-width="1.3"/>
    <text x="884" y="462" font-size="12" fill="#4d6276" text-anchor="middle" font-family="Inter,sans-serif">40-ft container (semi-D) · 20-ft (linked)</text>
  </g>

  <!-- ground line -->
  <path d="M40 380 H960" stroke="#0d2036" stroke-width="2"/>
</svg>
