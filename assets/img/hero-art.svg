<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="Illustration of a semi-detached light industrial factory">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b2340"/><stop offset="100%" stop-color="#123b5f"/>
    </linearGradient>
    <linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071b33"/><stop offset="60%" stop-color="#0e2b4a"/><stop offset="100%" stop-color="#16375c"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c4a75"/><stop offset="100%" stop-color="#123b5f"/>
    </linearGradient>
    <linearGradient id="facade2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#194570"/><stop offset="100%" stop-color="#0d2a46"/>
    </linearGradient>
  </defs>

  <rect width="900" height="620" fill="url(#skyg)"/>
  <circle cx="742" cy="112" r="58" fill="#c9973c" opacity="0.12"/>
  <circle cx="742" cy="112" r="34" fill="#c9973c" opacity="0.18"/>

  <!-- ground -->
  <rect y="470" width="900" height="150" fill="#061527"/>
  <path d="M0 470 H900" stroke="#c9973c" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- distant blocks -->
  <g stroke="#c9973c" stroke-opacity="0.28" fill="none" stroke-width="1.4">
    <path d="M40 470 V424 H150 V470"/>
    <path d="M150 470 V440 H232 V470"/>
    <path d="M690 470 V432 H800 V470"/>
    <path d="M800 470 V450 H862 V470"/>
  </g>

  <!-- main factory block (semi-detached pair) -->
  <g>
    <path d="M168 470 V258 H470 V470" fill="url(#facade)" stroke="#c9973c" stroke-opacity="0.75" stroke-width="1.6"/>
    <path d="M470 470 V258 H772 V470" fill="url(#facade2)" stroke="#c9973c" stroke-opacity="0.55" stroke-width="1.6"/>
    <!-- roof trims -->
    <path d="M160 258 H478 M462 258 H780" stroke="#e7be69" stroke-width="3" fill="none"/>
    <path d="M160 266 H478 M462 266 H780" stroke="#c9973c" stroke-opacity="0.5" stroke-width="1.2" fill="none"/>
    <!-- parapet notches -->
    <g fill="#0b2340" stroke="#c9973c" stroke-opacity="0.6" stroke-width="1.2">
      <rect x="196" y="240" width="52" height="18"/><rect x="300" y="240" width="52" height="18"/>
      <rect x="404" y="240" width="52" height="18"/><rect x="532" y="240" width="52" height="18"/>
      <rect x="636" y="240" width="52" height="18"/>
    </g>
    <!-- first floor office glazing -->
    <g fill="#0a1f36" stroke="#a7c7e7" stroke-opacity="0.5" stroke-width="1.2">
      <rect x="196" y="288" width="252" height="46"/>
      <rect x="500" y="288" width="252" height="46"/>
    </g>
    <g stroke="#a7c7e7" stroke-opacity="0.35" stroke-width="1">
      <path d="M238 288 V334 M280 288 V334 M322 288 V334 M364 288 V334 M406 288 V334"/>
      <path d="M542 288 V334 M584 288 V334 M626 288 V334 M668 288 V334 M710 288 V334"/>
    </g>
    <!-- loading bays / roller shutters -->
    <g fill="#061527" stroke="#c9973c" stroke-opacity="0.6" stroke-width="1.3">
      <rect x="196" y="366" width="118" height="104"/>
      <rect x="330" y="366" width="118" height="104"/>
      <rect x="500" y="366" width="118" height="104"/>
      <rect x="634" y="366" width="118" height="104"/>
    </g>
    <g stroke="#c9973c" stroke-opacity="0.35" stroke-width="1">
      <path d="M196 386 H314 M196 406 H314 M196 426 H314 M196 446 H314"/>
      <path d="M330 386 H448 M330 406 H448 M330 426 H448 M330 446 H448"/>
      <path d="M500 386 H618 M500 406 H618 M500 426 H618 M500 446 H618"/>
      <path d="M634 386 H752 M634 406 H752 M634 426 H752 M634 446 H752"/>
    </g>
    <!-- party wall between pair -->
    <path d="M470 258 V470" stroke="#e7be69" stroke-opacity="0.75" stroke-width="2.4" fill="none"/>
  </g>

  <!-- container truck silhouette with box -->
  <g>
    <rect x="96" y="404" width="150" height="52" rx="3" fill="#0a1f36" stroke="#c9973c" stroke-opacity="0.7" stroke-width="1.4"/>
    <path d="M60 456 V428 h26 l14 -24 h22 v52 z" fill="#0e2b4a" stroke="#c9973c" stroke-opacity="0.6" stroke-width="1.3"/>
    <circle cx="86" cy="462" r="10" fill="#061527" stroke="#e7be69" stroke-opacity="0.7" stroke-width="1.4"/>
    <circle cx="132" cy="462" r="10" fill="#061527" stroke="#e7be69" stroke-opacity="0.7" stroke-width="1.4"/>
    <circle cx="222" cy="462" r="10" fill="#061527" stroke="#e7be69" stroke-opacity="0.7" stroke-width="1.4"/>
  </g>

  <!-- trees -->
  <g stroke="#c9973c" stroke-opacity="0.55" fill="none" stroke-width="1.4">
    <path d="M826 470 v-30 M812 442 l14 -20 14 20 M814 456 l12 -16 12 16"/>
    <path d="M40 470 v-26 M28 446 l12 -18 12 18"/>
  </g>

  <!-- eco badges -->
  <g font-family="Inter,sans-serif" font-size="12" fill="#e7be69" opacity="0.9">
    <g stroke="#c9973c" stroke-opacity="0.5" fill="none">
      <rect x="640" y="60" width="216" height="34" rx="17"/>
    </g>
    <text x="658" y="82">Rainwater harvesting · Solar ready</text>
  </g>
</svg>
